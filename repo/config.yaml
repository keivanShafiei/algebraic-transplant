# config.yaml — Hyperparameters matching Table 4 of the paper
# SINGLE SOURCE OF TRUTH: All scripts must read from this file.
# NOTE: Do NOT change these without updating Table 4 in the paper.
# The paper's results were produced with these exact values.

# --- Geometry & Resolution ---
n_nodes_list: [225]           # Training resolution (15×15 grid)
stencil_k: 25                 # k-NN neighbours for RBF-FD stencil

# --- Model Architecture (Table 4) ---
hidden_dim: 64                # Paper Table 4: hidden dimension
gnn_layers: 4                 # Paper Table 4: message-passing layers
projection_eps: 1.0e-8        # Paper Table 4: Tikhonov regularisation

# --- Training Hyperparameters (Table 4) ---
batch_size: 16
epochs: 200
lr: 0.001                     # Initial learning rate
weight_decay: 1e-4

# --- Loss Weights ---
w_vel: 1.0                    # Velocity loss weight
w_prs: 0.1                    # Pressure loss weight (key: w_prs, NOT w_pressure)
w_div: 0.01                   # Divergence auxiliary weight (key: w_div, NOT w_divergence)

# --- Numerical Stability ---
dtype: float32                # Inference precision (Remark 2)
operator_assembly_dtype: float64  # Assembly precision (Remark 2)

# --- Hardware ---
device: cuda                  # NVIDIA RTX 4090 (Table 4)
random_seeds: [42, 123, 456, 789, 1024]  # For reproducibility

# --- Checkpointing ---
save_freq: 10
results_dir: 'results'

# --- Legacy / Backward Compatibility (kept but not used by paper scripts) ---
in_channels: 1                # Parameter dimension (Re only)
out_channels: 3               # Output: u, v, p
num_layers: 4                  # Alias for gnn_layers (deprecated)
hidden_channels: 64            # Alias for hidden_dim (deprecated)
use_film: true                # FiLM conditioning enabled
re_conditioning: true          # Reynolds-number conditioning
fallback_strategy: 'hybrid'    # Adaptive solver fallback
