# config.yaml
# تنظیمات بهینه‌شده برای دو کارت Tesla T4 و داده‌های تک‌بعدی (فقط Reynolds Number)

# --- Geometry & Resolution ---
n_nodes_list: [225]       # رزولوشن آموزش (15x15 grid). برای تست رزولوشن‌های دیگر اضافه کنید.
stencil_k: 25             # تعداد همسایگان در استنسیل RBF-FD

# --- Model Architecture ---
# توجه: مقدار in_channels باید با بعد ورودی mu در داده‌های شما مطابقت داشته باشد.
# چون خطا نشان داد mu.shape=[16, 1]، این مقدار را به 1 تغییر می‌دهیم.
in_channels: 1            # اصلاح شده: 3 -> 1 (فقط پارامتر Re وارد می‌شود)
hidden_channels: 64       # ابعاد لایه پنهان
out_channels: 3           # خروجی: u, v, p
num_layers: 4             # تعداد لایه‌های GNN
hidden_dim: 128

# --- Conditioning & Strategy ---
re_conditioning: true     # فعال‌سازی شرطی‌سازی بر اساس عدد رینولدز
use_film: true            # استفاده از لایه FiLM برای تزریق شرط
fallback_strategy: 'hybrid' # استراتژی fallback (hybrid, pure_gnn, pure_mlp)

# --- Training Hyperparameters ---
batch_size: 16            # اندازه بچ (مناسب برای 2 کارت T4 با Mixed Precision)
epochs: 200               # تعداد اپوک‌های آموزش
lr: 0.001                 # نرخ یادگیری اولیه
weight_decay: 1e-4        # وزن جریمه L2

# --- Optimization Flags ---
use_multi_gpu: true       # فعال‌سازی DataParallel برای 2 GPU
amp_enabled: true         # فعال‌سازی Mixed Precision (AMP)

# --- Loss Weights ---
w_vel: 1.0                # وزن ضرر سرعت
w_prs: 0.1                # وزن ضرر فشار
w_div: 0.01               # وزن ضرر واگرایی (فیزیکی)

# --- Numerical Stability ---
projection_eps: 1e-06

# --- Checkpointing ---
save_freq: 10             # ذخیره چک‌پوینت هر چند اپوک
results_dir: 'results'    # پوشه خروجی
